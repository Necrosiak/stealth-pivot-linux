name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh status.sh files/bind-xpad
      - name: Helper tests
        run: python3 -m unittest discover -s tests -v
      - name: Systemd unit syntax
        run: |
          mkdir -p /tmp/pivot-unit
          sed 's|ExecStart=/etc/stealth-pivot/bind-xpad|ExecStart=/bin/true|' files/nm-stealth-pivot-xpad.service > /tmp/pivot-unit/nm-stealth-pivot-xpad.service
          systemd-analyze verify /tmp/pivot-unit/nm-stealth-pivot-xpad.service
